services:
  yoda-b:
    build:
      dockerfile: Containerfile
    image: ghcr.io/pedrocasais/yoda:master
    networks:
      - proxy
    restart: unless-stopped

  yoda-c:
    build:
      dockerfile: Containerfile
    image: ghcr.io/pedrocasais/yoda:master
    command: ["./yodac.exe"]
    user: "0:0"
    volumes:
      - ${CONTAINER_ENGINE_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - /var/lib/yodac:/var/lib/yodac
    environment:
      YODAC_WORK_ROOT: /var/lib/yodac
    networks:
      - proxy
    restart: unless-stopped

  valkey:
    image: valkey/valkey:latest
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkey_data:/data
    networks:
      - proxy
    restart: unless-stopped

  yoda-a:
    image: ghcr.io/anmaped/yoda-web:latest
    ports:
      - "80:80"
    environment:
      # The browser calls the API through yoda-a's /api proxy.
      BASE_API_URL: http://localhost/api
      API_ROUTING_URL: http://yoda-b:8001/
    depends_on:
      - yoda-b
    networks:
      - proxy
    restart: unless-stopped

networks:
  proxy:
    name: proxy

volumes:
  valkey_data:
